name: wipli_mobile
description: App móvil de Wipli (iOS + Android) — cliente de la API de TaskPilot/Wipli.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.5.1

  # Rutas / deep links
  go_router: ^14.2.0

  # HTTP
  dio: ^5.5.0+1

  # Almacenamiento seguro (token/sesión)
  flutter_secure_storage: ^9.2.2

  # Login con Google (mismo criterio invitación-solo del backend)
  google_sign_in: ^6.2.1

  # Selección de imágenes para adjuntos del chat (F4)
  image_picker: ^1.1.2

  # Detección de conexión (offline / sincronización — F2b)
  connectivity_plus: ^6.0.3

  # Persistencia local (SQLite) para el modo offline — F2b
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Utilidades
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  pdfx: ^2.11.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generación de íconos y splash (F6)
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

# Íconos de launcher (F6). Regenerar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#111318"
  adaptive_icon_background: "#111318"
  adaptive_icon_foreground: "assets/branding/wipli_mark.png"

# Splash screen (F6). Regenerar con: dart run flutter_native_splash:create
# Marca Wipli: fondo ink (#111318) + logo centrado, claro y oscuro por igual.
flutter_native_splash:
  color: "#111318"
  image: "assets/branding/splash_logo.png"
  android_12:
    color: "#111318"
    image: "assets/branding/splash_logo.png"
    icon_background_color: "#111318"
