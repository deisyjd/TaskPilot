name: wipli_mobile
description: App móvil de Wipli (iOS + Android) — cliente de la API de TaskPilot/Wipli.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.5.1

  # Rutas / deep links
  go_router: ^14.2.0

  # HTTP
  dio: ^5.5.0+1

  # Almacenamiento seguro (token/sesión)
  flutter_secure_storage: ^9.2.2

  # Login con Google (mismo criterio invitación-solo del backend)
  google_sign_in: ^6.2.1

  # Detección de conexión (offline / sincronización — F2b)
  connectivity_plus: ^6.0.3

  # Utilidades
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
